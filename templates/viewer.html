<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVL Auction — Live Viewer</title>
<style>
:root{
  --navy:#0B1F3A;
  --navy-2:#122A4D;
  --navy-3:#1B3B66;
  --sand:#F5EEE2;
  --sand-2:#EFE4D0;
  --orange:#EF6C1F;
  --orange-2:#FF8A3D;
  --teal:#17958A;
  --gold:#F4B942;
  --red:#D8494B;
  --ink:#12181F;
  --muted:#66707C;
  --line:rgba(11,31,58,0.12);
  --white:#FFFFFF;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 10px 30px rgba(11,31,58,0.18);
  --font-display: Arial Black, "Segoe UI Black", "Helvetica Neue", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Consolas", "Menlo", monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 34px),
    radial-gradient(circle at 10% -10%, var(--navy-3) 0%, var(--navy) 45%),
    var(--navy);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--orange); color:#fff; }
a{ color:inherit; }
.hidden{ display:none !important; }

.app-header{ padding:18px 20px 0; max-width:1200px; margin:0 auto; }
.brand{ display:flex; align-items:center; gap:14px; color:var(--sand); margin-bottom:14px; flex-wrap:wrap; }
.brand-mark{
  width:44px;height:44px;border-radius:50%;
  background:conic-gradient(var(--orange) 0deg 90deg, var(--sand) 90deg 180deg, var(--orange) 180deg 270deg, var(--sand) 270deg 360deg);
  border:3px solid var(--sand); flex:0 0 auto; box-shadow:0 4px 14px rgba(0,0,0,0.35);
}
.brand h1{ font-family:var(--font-display); font-size:22px; letter-spacing:0.5px; margin:0; text-transform:uppercase; }
.brand .tag{ display:block; font-family:var(--font-mono); font-size:11px; color:var(--orange-2); letter-spacing:2px; margin-top:2px; }
.live-badge{
  margin-left:auto; font-family:var(--font-mono); font-size:12px; font-weight:700;
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
  padding:7px 14px; border-radius:999px; color:var(--gold);
  display:flex; align-items:center; gap:8px; white-space:nowrap; letter-spacing:1px;
}
.live-dot{ width:9px;height:9px;border-radius:50%; background:var(--gold); animation:pulse 1.2s infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

main{ max-width:1200px; margin:0 auto; padding:22px 20px 60px; }
.card{ background:var(--sand); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:18px; }
.card h2{ font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.5px; font-size:15px; margin:0 0 4px; color:var(--navy); }
.card .sub{ color:var(--muted); font-size:13px; margin:0 0 14px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grid{ display:grid; gap:16px; }
.grid.cols-2{ grid-template-columns:1fr 1fr; }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
.grid.cols-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:820px){
  .grid.cols-2, .grid.cols-3, .grid.cols-4{ grid-template-columns:1fr; }
}

.kpi{ background:#fff; border-radius:12px; padding:14px 16px; border:1.5px solid var(--line); }
.kpi .num{ font-family:var(--font-mono); font-size:24px; font-weight:700; color:var(--navy); }
.kpi .lbl{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }

.scoreboard{
  background:radial-gradient(circle at 30% 0%, var(--navy-3), var(--navy));
  border-radius:20px; padding:26px; color:var(--sand); position:relative; overflow:hidden; border:2px solid rgba(255,255,255,0.08);
}
.scoreboard::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 40px); pointer-events:none; }
.sb-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; position:relative; z-index:1; }
.sb-player-name{ font-family:var(--font-display); font-size:clamp(22px,4vw,34px); text-transform:uppercase; letter-spacing:0.5px; margin:0; }
.sb-player-meta{ font-family:var(--font-mono); font-size:12.5px; color:var(--orange-2); margin-top:4px; }
.sb-timer{ width:78px; height:78px; position:relative; flex:0 0 auto; }
.sb-timer svg{ transform:rotate(-90deg); }
.sb-timer .ring-bg{ fill:none; stroke:rgba(255,255,255,0.14); stroke-width:7; }
.sb-timer .ring-fg{ fill:none; stroke:var(--gold); stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset .25s linear, stroke .2s; }
.sb-timer .ring-fg.low{ stroke:var(--red); }
.sb-timer-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:20px; font-weight:700; }
.sb-mid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:22px 0 6px; position:relative; z-index:1; }
.sb-stat-label{ font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px; color:rgba(245,238,226,0.55); text-transform:uppercase; }
.sb-bid-amount{ font-family:var(--font-mono); font-size:clamp(30px,6vw,52px); font-weight:700; color:var(--gold); line-height:1.1; }
.sb-bidder-name{ font-family:var(--font-display); font-size:20px; text-transform:uppercase; margin-top:2px; }
.sb-idle{ font-family:var(--font-display); font-size:clamp(20px,3.5vw,30px); text-transform:uppercase; text-align:center; padding:30px 10px; color:rgba(245,238,226,0.7); letter-spacing:1px; position:relative; z-index:1; }

.final-banner{
  text-align:center; background:linear-gradient(90deg, var(--orange), var(--orange-2));
  color:#fff; font-family:var(--font-display); font-size:clamp(22px,4vw,36px);
  letter-spacing:4px; text-transform:uppercase; padding:18px 10px; border-radius:14px;
  box-shadow:var(--shadow); margin-bottom:18px;
}

.team-grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); }
.team-card{ background:var(--sand); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); border-top:4px solid var(--teal); }
.team-card.final{ border-top-color:var(--gold); }
.team-card h3{ font-family:var(--font-display); text-transform:uppercase; font-size:15px; letter-spacing:0.5px; margin:0 0 2px; color:var(--navy); }
.team-card .meta{ font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-bottom:10px; }
.team-card ul{ list-style:none; margin:0; padding:0; }
.team-card li{ padding:6px 0; border-bottom:1px dashed var(--line); font-size:13.5px; color:var(--ink); display:flex; justify-content:space-between; gap:8px; }
.team-card li:last-child{ border-bottom:none; }
.team-card li .p{ font-family:var(--font-mono); font-size:12px; color:var(--muted); white-space:nowrap; }
.team-card .empty-list{ color:var(--muted); font-size:13px; padding:6px 0; }

.thumb{ width:26px; height:26px; object-fit:cover; border-radius:6px; border:1px solid var(--line); vertical-align:middle; margin-right:7px; background:#fff; }
.thumb-empty{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:6px; border:1px dashed var(--line); color:var(--muted); font-size:11px; vertical-align:middle; margin-right:7px; background:#fff; }
.sb-photo{ width:84px; height:84px; object-fit:cover; border-radius:14px; border:3px solid rgba(255,255,255,0.25); background:var(--navy-2); }

.footer-note{ text-align:center; color:rgba(245,238,226,0.45); font-size:11.5px; padding:10px 0 30px; font-family:var(--font-mono); }
.footer-note a{ color:var(--orange-2); }
</style>
</head>
<body>

<div class="app-header">
  <div class="brand">
    <div class="brand-mark"></div>
    <div>
      <h1 id="tournamentName">RAVL Auction Room</h1>
      <span class="tag">LIVE VIEWER · PUBLIC SCREEN</span>
    </div>
    <div class="live-badge" id="liveBadge"><span class="live-dot"></span><span id="connText">CONNECTING</span></div>
  </div>
</div>

<main>

  <div class="grid cols-4" id="kpis"></div>

  <!-- Live scoreboard (hidden when admin switches the viewer to FINAL TEAMS) -->
  <div class="card scoreboard" id="scoreboardCard">
    <div class="sb-idle" id="sbIdle">Waiting for the next player…</div>
    <div class="sb-top hidden" id="sbTop">
      <div class="row" style="gap:16px; align-items:center; position:relative; z-index:1;">
        <img class="sb-photo" id="sbPhoto" src="" alt="" style="display:none;">
        <div>
          <p class="sb-player-name" id="sbName">—</p>
          <p class="sb-player-meta" id="sbMeta">—</p>
        </div>
      </div>
      <div class="sb-timer">
        <svg width="78" height="78" viewBox="0 0 78 78">
          <circle class="ring-bg" cx="39" cy="39" r="33"></circle>
          <circle class="ring-fg" id="ringFg" cx="39" cy="39" r="33" stroke-dasharray="207" stroke-dashoffset="0"></circle>
        </svg>
        <div class="sb-timer-num" id="sbTimerNum">--</div>
      </div>
    </div>
    <div class="sb-mid hidden" id="sbMid">
      <div>
        <div class="sb-stat-label">Current Bid</div>
        <div class="sb-bid-amount" id="sbBidAmount">—</div>
      </div>
      <div>
        <div class="sb-stat-label">Highest Bidder</div>
        <div class="sb-bidder-name" id="sbBidder">No bids yet</div>
      </div>
    </div>
  </div>

  <!-- Final teams reveal (admin-controlled via the main app) -->
  <div class="final-banner hidden" id="finalBanner">Final Teams</div>

  <div class="card">
    <h2 id="rostersTitle">Team Rosters</h2>
    <p class="sub">Every player sold so far, team by team.</p>
    <div class="team-grid" id="teamGrid"></div>
  </div>

</main>

<div class="footer-note"><a href="/">Open admin / captain console</a> · RAVL Auction Room · live multi-device auction board</div>

<script>
let state = null;
let clockOffset = 0;
let countdownHandle = null;

const fmt = { weekday:'short', day:'numeric', month:'short' };

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function money(n){
  const cur = (state && state.settings ? state.settings.currency : '₹');
  const v = Number(n||0);
  const CR = 10000000, LAKH = 100000;
  if(v >= CR) return cur + (v/CR).toLocaleString('en-IN', {maximumFractionDigits:2}) + ' Crore';
  if(v >= LAKH) return cur + (v/LAKH).toLocaleString('en-IN', {maximumFractionDigits:2}) + ' Lakh';
  return cur + v.toLocaleString('en-IN');
}
function findCaptain(id){ return state.captains.find(c=>c.id===id); }
function thumbHTML(p){
  return p && p.photo
    ? `<img class="thumb" src="/uploads/${esc(p.photo)}" alt="" loading="lazy">`
    : `<span class="thumb-empty">👤</span>`;
}

async function fetchState(){
  try{
    const res = await fetch('/api/state');
    const fresh = await res.json();
    state = fresh;
    clockOffset = fresh.server_time - Date.now();
    render();
  }catch(e){
    document.getElementById('connText').textContent = 'OFFLINE';
  }
}
setInterval(fetchState, 1500);

function render(){
  document.getElementById('connText').textContent = 'LIVE';
  const s = state.settings;
  document.title = s.tournament_name + ' — Live Viewer';
  document.getElementById('tournamentName').textContent = s.tournament_name || 'RAVL Auction Room';

  const sold = state.players.filter(p=>p.status==='sold');
  const unsold = state.players.filter(p=>p.status==='unsold');
  const available = state.players.filter(p=>p.status==='available');
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="num">${state.players.length}</div><div class="lbl">Total Players</div></div>
    <div class="kpi"><div class="num">${sold.length}</div><div class="lbl">Sold</div></div>
    <div class="kpi"><div class="num">${unsold.length}</div><div class="lbl">Unsold</div></div>
    <div class="kpi"><div class="num">${available.length}</div><div class="lbl">Remaining</div></div>
  `;

  // Final teams mode (admin toggled in the main app)
  const finalMode = s.viewer_mode === 'final';
  document.getElementById('finalBanner').classList.toggle('hidden', !finalMode);
  document.getElementById('scoreboardCard').classList.toggle('hidden', finalMode);
  document.getElementById('rostersTitle').textContent = finalMode ? 'Final Teams' : 'Team Rosters';

  if(!finalMode) renderScoreboard();
  renderTeams(finalMode);
}

function renderScoreboard(){
  const a = state.auction;
  const player = a.current_player_id ? state.players.find(p=>p.id===a.current_player_id) : null;
  const idle = document.getElementById('sbIdle');
  const top = document.getElementById('sbTop');
  const mid = document.getElementById('sbMid');

  if(!player){
    idle.classList.remove('hidden');
    top.classList.add('hidden');
    mid.classList.add('hidden');
    return;
  }
  idle.classList.add('hidden');
  top.classList.remove('hidden');
  mid.classList.remove('hidden');
  document.getElementById('sbName').textContent = player.name;
  document.getElementById('sbMeta').textContent = [player.team, player.position].filter(Boolean).join(' · ') || 'No team / position listed';
  document.getElementById('sbBidAmount').textContent = a.current_bidder_id ? money(a.current_bid) : 'Starting ' + money(player.base_price);
  document.getElementById('sbBidder').textContent = a.current_bidder_id ? (findCaptain(a.current_bidder_id)?.name || '—') : 'No bids yet';
  const sbPhoto = document.getElementById('sbPhoto');
  if(sbPhoto){
    if(player.photo){ sbPhoto.src = '/uploads/' + player.photo; sbPhoto.style.display = 'inline-block'; }
    else { sbPhoto.style.display = 'none'; }
  }
  renderCountdown();
}

function renderCountdown(){
  const a = state.auction;
  if(!a.current_player_id || !a.timer_end) return;
  const remaining = Math.max(0, a.timer_end - (Date.now() + clockOffset));
  const secs = Math.ceil(remaining/1000);
  const total = state.settings.timer_seconds;
  const circumference = 207;
  const ratio = Math.max(0, Math.min(1, remaining/(total*1000)));
  const ring = document.getElementById('ringFg');
  if(ring){
    ring.setAttribute('stroke-dashoffset', String(circumference * (1-ratio)));
    ring.classList.toggle('low', secs<=10);
  }
  const numEl = document.getElementById('sbTimerNum');
  if(numEl) numEl.textContent = secs;
}
function startCountdown(){
  if(countdownHandle) clearInterval(countdownHandle);
  countdownHandle = setInterval(()=>{
    if(state && state.auction && state.auction.current_player_id) renderCountdown();
  }, 250);
}
startCountdown();

function renderTeams(finalMode){
  const grid = document.getElementById('teamGrid');
  if(state.captains.length===0){
    grid.innerHTML = '<div class="empty-list" style="color:var(--muted);">No captains added yet.</div>';
    return;
  }
  grid.innerHTML = state.captains.map(c=>{
    const members = state.players.filter(p=>p.sold_to===c.id);
    const spent = c.budget - c.remaining;
    const rows = members.length
      ? members.map(p=>`<li>${thumbHTML(p)}<span>${esc(p.name)}</span><span class="p">${p.sold_price ? money(p.sold_price) : ''}</span></li>`).join('')
      : '<div class="empty-list">No players yet</div>';
    return `
      <div class="team-card ${finalMode?'final':''}">
        <h3>${esc(c.name)}</h3>
        <div class="meta">${members.length} player(s) · spent ${money(spent)} · left ${money(c.remaining)}</div>
        <ul>${rows}</ul>
      </div>`;
  }).join('');
}

fetchState();
</script>
</body>
</html>
